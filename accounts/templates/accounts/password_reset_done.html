{% extends 'base.html' %}

{% block title %}Check Your Email - TUT Digital Student Card{% endblock %}

{% block content %}
<div class="page-header">
    <div class="container">
        <h1>Check Your Email</h1>
    </div>
</div>

<div class="container my-5">
    <div class="row">
        <div class="col-md-5 mx-auto">
            <div class="card">
                <div class="card-body text-center">
                    <i class="fas fa-envelope-open-text fa-3x text-primary mb-3"></i>
                    <p>If an account exists with that email address, we've sent a link to reset your password. It should arrive within a few minutes.</p>
                    <a href="{% url 'login' %}" class="btn btn-outline-primary mt-2">
                        <i class="fas fa-arrow-left"></i> Back to login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
