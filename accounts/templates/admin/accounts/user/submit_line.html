{% extends "admin/submit_line.html" %}
{% load static %}

{% block submit-row %}
<style>
    /* Django's own forms.css deliberately uppercases just the primary
       submit-row button (.submit-row input.default) to make it stand out -
       every other button in this row (Save and add another, Delete, our
       Revoke/Reissue buttons) renders in normal case, so this made the
       primary one visually inconsistent with the rest of the row. */
    .submit-row input.default { text-transform: none; }
</style>
{{ block.super }}
{% if original %}
    <form method="post" action="{% url 'admin:accounts_user_revoke_card' original.pk %}" style="display:inline;"
          data-confirm="Revoke {{ original.get_full_name_display }}'s digital card? It will immediately show as invalid when scanned.">
        {% csrf_token %}
        <input type="submit" class="button" value="Revoke Card" style="background:#a4231c; color:#fff;">
    </form>
    <form method="post" action="{% url 'admin:accounts_user_reissue_card' original.pk %}" style="display:inline;"
          data-confirm="Reissue a new card number and QR code for {{ original.get_full_name_display }}? Their old card number will stop working.">
        {% csrf_token %}
        <input type="submit" class="button" value="Reissue Card" style="background:#198754; color:#fff;">
    </form>
    <script src="{% static 'js/confirm-submit.js' %}"></script>
{% endif %}
{% endblock %}
