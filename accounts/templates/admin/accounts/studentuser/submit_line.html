{% extends "admin/submit_line.html" %}

{% block submit-row %}
{{ block.super }}
{% if original %}
    <form method="post" action="{% url 'admin:accounts_studentuser_revoke_card' original.pk %}" style="display:inline;"
          onsubmit="return confirm('Revoke {{ original.get_full_name_display }}\'s digital card? It will immediately show as invalid when scanned.');">
        {% csrf_token %}
        <button type="submit" class="button" style="background:#a4231c; color:#fff;">Revoke Card</button>
    </form>
    <form method="post" action="{% url 'admin:accounts_studentuser_reissue_card' original.pk %}" style="display:inline;"
          onsubmit="return confirm('Reissue a new card number and QR code for {{ original.get_full_name_display }}? Their old card number will stop working.');">
        {% csrf_token %}
        <button type="submit" class="button" style="background:#6f42c1; color:#fff;">Reissue Card</button>
    </form>
{% endif %}
{% endblock %}
